name: PennyJar
options:
  bundleIdPrefix: com.pennyjar
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # ← 在 Xcode Signing 里选你的个人 Apple ID Team
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"          # Xcode 26 / Swift 6.3.3 工具链
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  PennyJar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Src
    info:
      path: Src/Resources/Info.plist
      properties:
        CFBundleDisplayName: penny_jar
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: 用于「记一笔」时选择照片作为记账凭证
        NSCameraUsageDescription: 用于「记一笔」拍照记录消费凭证
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pennyjar.app
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  PennyJarTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: PennyJar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pennyjar.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PennyJar:
    build:
      targets:
        PennyJar: all
        PennyJarTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PennyJarTests
